<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERPUNK VIP INVITATION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', 'Orbitron', sans-serif;
            background: #05050a;
            /* 사이버 그리드 배경 연출 */
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
            padding: 20px;
            overflow: hidden;
        }

        /* ----------------------------------
           ⚡ [NEW] 박스/모달 전용 글리치 애니메이션 (RGB Split & Box Jitter)
        ---------------------------------- */
        .box-glitch-active {
            position: relative;
            animation: boxGlitchShake 0.45s cubic-bezier(0.25, 1, 0.5, 1) !important;
        }

        /* 박스 내부 치지직 빛 갈라짐 의상 레이어 연출 */
        .box-glitch-active::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 243, 255, 0.15);
            border-radius: inherit;
            pointer-events: none;
            z-index: 100;
            animation: boxOverlayFlash 0.45s steps(2, start);
        }

        @keyframes boxGlitchShake {
            0% {
                transform: translate(0, 0) skew(0deg);
                box-shadow: 0 0 35px rgba(0, 243, 255, 0.35);
            }
            15% {
                transform: translate(-6px, 3px) skew(-2deg);
                box-shadow: -5px 0 25px #ff007f, 5px 0 25px #00f3ff;
                filter: contrast(150%);
            }
            30% {
                transform: translate(7px, -4px) skew(3deg);
                box-shadow: 6px 0 30px #00f3ff, -6px 0 30px #ffe600;
            }
            45% {
                transform: translate(-5px, -2px) skew(-1deg);
                box-shadow: -4px 0 20px #ff007f;
            }
            60% {
                transform: translate(4px, 5px) skew(2deg);
                box-shadow: 4px 0 25px #00f3ff;
            }
            75% {
                transform: translate(-2px, 1px) skew(-1deg);
            }
            100% {
                transform: translate(0, 0) skew(0deg);
                filter: none;
            }
        }

        @keyframes boxOverlayFlash {
            0% {
                opacity: 0.9;
                clip-path: inset(10% 0 60% 0);
                background: rgba(255, 0, 127, 0.3);
            }
            25% {
                opacity: 0.7;
                clip-path: inset(50% 0 10% 0);
                background: rgba(0, 243, 255, 0.3);
            }
            50% {
                opacity: 1;
                clip-path: inset(20% 0 40% 0);
                background: rgba(255, 230, 0, 0.25);
            }
            75% {
                opacity: 0.5;
                clip-path: inset(70% 0 5% 0);
                background: rgba(255, 0, 127, 0.2);
            }
            100% {
                opacity: 0;
                clip-path: none;
            }
        }


        /* ----------------------------------
           0. 사전 수신 경고 화면 (Gatekeeper)
        ---------------------------------- */
        .gate-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #030308;
            background-image: radial-gradient(circle at center, rgba(0, 243, 255, 0.08) 0%, rgba(3, 3, 8, 0.95) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), 
                        visibility 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gate-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .gate-card {
            background: rgba(10, 14, 23, 0.95);
            border: 2px solid #ff007f;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 45px 30px 35px 30px;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.4), inset 0 0 20px rgba(255, 0, 127, 0.15);
            position: relative;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 25px rgba(255, 0, 127, 0.3); }
            100% { box-shadow: 0 0 45px rgba(255, 0, 127, 0.6), 0 0 10px #00f3ff; }
        }

        .gate-card::before {
            content: "INCOMING ENCRYPTED SIGNAL";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff007f;
            color: #fff;
            font-size: 0.65rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            padding: 3px 12px;
            letter-spacing: 1.5px;
            border-radius: 2px;
            white-space: nowrap;
            box-shadow: 0 0 10px #ff007f;
        }

        .alert-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #ff007f;
            animation: alertBlink 1.2s infinite;
        }

        @keyframes alertBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }

        .gate-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px #ffffff;
            margin-bottom: 12px;
            word-break: keep-all;
            line-height: 1.4;
        }

        .gate-desc {
            font-size: 0.95rem;
            color: #ff007f;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
            margin-bottom: 30px;
            font-weight: 700;
            word-break: keep-all;
        }

        .btn-open {
            background: linear-gradient(135deg, #ff007f 0%, #ff0055 100%) !important;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6) !important;
            color: #ffffff !important;
        }

        .btn-open:hover {
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.9) !important;
        }

        /* ----------------------------------
           1. 🎟️ 사이버 티켓 메인 카드
        ---------------------------------- */
        .ticket {
            background: rgba(10, 14, 23, 0.9);
            border: 2px solid #00f3ff;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 45px 30px 35px 30px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.35), inset 0 0 20px rgba(0, 243, 255, 0.1);
            position: relative;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.2s ease;
        }

        .ticket::before {
            content: "SECURITY LEVEL :: VIP CLEARANCE";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #00f3ff;
            color: #000;
            font-size: 0.65rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            padding: 3px 12px;
            letter-spacing: 1.5px;
            border-radius: 2px;
            white-space: nowrap;
            box-shadow: 0 0 10px #00f3ff;
        }

        .vip-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ff007f;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.3rem;
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px rgba(0, 243, 255, 0.5);
            margin-bottom: 8px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.15rem;
            color: #ffe600;
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.6);
            margin-bottom: 25px;
            word-break: keep-all;
            font-weight: 700;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #00f3ff, #ff007f, transparent);
            margin: 25px 0;
            box-shadow: 0 0 8px #00f3ff;
        }

        .content {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #c8d6e5;
            margin-bottom: 30px;
            word-break: keep-all;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px 0;
            font-size: 1.15rem;
            font-weight: 900;
            font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
            color: #000000;
            background: linear-gradient(135deg, #00f3ff 0%, #00a8ff 100%);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
            transition: all 0.3s ease;
            clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.2);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.9);
        }

        /* ----------------------------------
           2. 🔒 사이버 모달 팝업
        ---------------------------------- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(3, 3, 8, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.0s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(10, 14, 23, 0.95);
            border: 2px solid #ff007f;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 0 45px rgba(255, 0, 127, 0.5), inset 0 0 15px rgba(255, 0, 127, 0.2);
            transform: scale(0.8) translateY(30px);
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.2s ease;
            opacity: 0;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .modal-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #ff007f;
            text-shadow: 0 0 8px #ff007f;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .modal-title {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 0 0 10px #ffffff;
        }

        .hint-box {
            background: rgba(0, 243, 255, 0.05);
            border: 1px dashed #00f3ff;
            border-radius: 8px;
            padding: 22px 15px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #00f3ff;
            text-shadow: 0 0 12px #00f3ff;
            line-height: 1.5;
            word-break: keep-all;
        }

        .sub-hint {
            font-size: 0.95rem;
            color: #ffe600;
            text-shadow: 0 0 8px rgba(255, 230, 0, 0.6);
            margin-bottom: 25px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .close-btn {
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: 900;
            font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
            color: #ffffff;
            background: #ff007f;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff007f;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 30px #ffffff;
        }
    </style>
</head>
<body>

    <!-- 🚨 0. 최초 수신 화면 (Gatekeeper Overlay) -->
    <div class="gate-container" id="gateOverlay">
        <div class="gate-card" id="gateCard">
            <div class="alert-icon">📩</div>
            <div class="gate-title">수상한 초대장이 도착했습니다!</div>
            <div class="gate-desc">열어보시겠습니까? 🔓</div>
            <button class="btn btn-open" onclick="triggerTargetGlitch('gateCard', unlockTicket)">초대장 열어보기 ⚡</button>
        </div>
    </div>

    <!-- 🎟️ 1. 메인 초대장 카운터 카드 -->
    <div class="ticket" id="mainTicket">
        <div class="vip-tag">EXCLUSIVE INVITATION</div>
        <div class="title">LUCKY DRAW</div>
        <div class="subtitle">🎉 조연우를 위한 럭키 드로우 🎉</div>

        <div class="divider"></div>

        <div class="content">
            고생한 당신을 위해 준비된<br>
            시크릿 럭키 드로우 이벤트에 초대합니다.<br><br>
            아래 버튼을 눌러 시크릿 비밀번호를 확인하세요!
        </div>

        <!-- 🔑 비밀번호 확인 버튼 -->
        <button class="btn" onclick="triggerTargetGlitch('mainTicket', openHint)">비밀번호 확인하기 🙈</button>
    </div>

    <!-- 🔒 2. 비밀번호 힌트 모달 -->
    <div class="modal-overlay" id="hintModal">
        <div class="modal-card" id="modalCard">
            <div class="modal-label">SECRET ACCESS CODE</div>
            <div class="modal-title">🔑 인증 비밀번호</div>
            
            <div class="hint-box">
                소중한 여자친구의 생일 4자리 🤭
            </div>

            <div class="sub-hint">💡잘 외워두세요!💡</div>

            <button class="close-btn" onclick="triggerTargetGlitch('modalCard', closeHint)">확인 완료</button>
        </div>
    </div>

    <script>
        // 타겟 박스/모달 요소 전용 글리치 애니메이션 실행 함수
        function triggerTargetGlitch(targetId, callback) {
            const targetElement = document.getElementById(targetId);

            if (targetElement) {
                // 해당 박스 카드에만 치지직 클래스 추가
                targetElement.classList.add('box-glitch-active');

                // 0.2초간 치지직거린 피크 타이밍에 화면 전환 액션 수행
                setTimeout(() => {
                    callback();
                }, 200);

                // 애니메이션 종료(0.45초) 후 효과 클래스 제거
                setTimeout(() => {
                    targetElement.classList.remove('box-glitch-active');
                }, 450);
            } else {
                callback();
            }
        }

        // 초대장 열기 함수
        function unlockTicket() {
            document.getElementById('gateOverlay').classList.add('hidden');
        }

        // 비밀번호 힌트 팝업 열기/닫기
        function openHint() {
            document.getElementById('hintModal').classList.add('active');
        }

        function closeHint() {
            document.getElementById('hintModal').classList.remove('active');
        }
    </script>

</body>
</html>
