<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBERPUNK VIP INVITATION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', 'Orbitron', sans-serif;
            background: #05050a;
            /* 사이버 그리드 배경 연출 */
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
            padding: 20px;
            overflow: hidden;
        }

        /* ----------------------------------
           0. 사전 수신 경고 화면 (Gatekeeper)
        ---------------------------------- */
        .gate-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #030308;
            background-image: radial-gradient(circle at center, rgba(0, 243, 255, 0.08) 0%, rgba(3, 3, 8, 0.95) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .gate-container.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .gate-card {
            background: rgba(10, 14, 23, 0.95);
            border: 2px solid #ff007f;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 45px 30px 35px 30px;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.4), inset 0 0 20px rgba(255, 0, 127, 0.15);
            position: relative;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 25px rgba(255, 0, 127, 0.3); }
            100% { box-shadow: 0 0 45px rgba(255, 0, 127, 0.6), 0 0 10px #00f3ff; }
        }

        .gate-card::before {
            content: "INCOMING ENCRYPTED SIGNAL";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff007f;
            color: #fff;
            font-size: 0.65rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            padding: 3px 12px;
            letter-spacing: 1.5px;
            border-radius: 2px;
            white-space: nowrap;
            box-shadow: 0 0 10px #ff007f;
        }

        .alert-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #ff007f;
            animation: alertBlink 1.2s infinite;
        }

        @keyframes alertBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }

        .gate-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px #ffffff;
            margin-bottom: 12px;
            word-break: keep-all;
            line-height: 1.4;
        }

        .gate-desc {
            font-size: 0.95rem;
            color: #ff007f;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
            margin-bottom: 30px;
            font-weight: 700;
            word-break: keep-all;
        }

        .btn-open {
            background: linear-gradient(135deg, #ff007f 0%, #ff0055 100%) !important;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.6) !important;
            color: #ffffff !important;
        }

        .btn-open:hover {
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.9) !important;
        }


        /* ----------------------------------
           1. 🎟️ 사이버 티켓 메인 카드
        ---------------------------------- */
        .ticket {
            background: rgba(10, 14, 23, 0.9);
            border: 2px solid #00f3ff;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 45px 30px 35px 30px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.35), inset 0 0 20px rgba(0, 243, 255, 0.1);
            position: relative;
        }

        /* 상단 상징 뱃지 태그 */
        .ticket::before {
            content: "SECURITY LEVEL :: VIP CLEARANCE";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #00f3ff;
            color: #000;
            font-size: 0.65rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            padding: 3px 12px;
            letter-spacing: 1.5px;
            border-radius: 2px;
            white-space: nowrap;
            box-shadow: 0 0 10px #00f3ff;
        }

        .vip-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ff007f;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.3rem;
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px rgba(0, 243, 255, 0.5);
            margin-bottom: 8px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.15rem;
            color: #ffe600;
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.6);
            margin-bottom: 25px;
            word-break: keep-all;
            font-weight: 700;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #00f3ff, #ff007f, transparent);
            margin: 25px 0;
            box-shadow: 0 0 8px #00f3ff;
        }

        .content {
            font-size: 0.95rem;
            line-height: 1.8;
            color: #c8d6e5;
            margin-bottom: 30px;
            word-break: keep-all;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px 0;
            font-size: 1.15rem;
            font-weight: 900;
            font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
            color: #000000;
            background: linear-gradient(135deg, #00f3ff 0%, #00a8ff 100%);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
            transition: all 0.2s ease;
            clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.2);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.9);
        }

        /* ----------------------------------
           2. 🔒 사이버 모달 팝업
        ---------------------------------- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(3, 3, 8, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(10, 14, 23, 0.95);
            border: 2px solid #ff007f;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 0 45px rgba(255, 0, 127, 0.5), inset 0 0 15px rgba(255, 0, 127, 0.2);
            transform: scale(0.85) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #ff007f;
            text-shadow: 0 0 8px #ff007f;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .modal-title {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 0 0 10px #ffffff;
        }

        .hint-box {
            background: rgba(0, 243, 255, 0.05);
            border: 1px dashed #00f3ff;
            border-radius: 8px;
            padding: 22px 15px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #00f3ff;
            text-shadow: 0 0 12px #00f3ff;
            line-height: 1.5;
            word-break: keep-all;
        }

        .sub-hint {
            font-size: 0.95rem;
            color: #ffe600;
            text-shadow: 0 0 8px rgba(255, 230, 0, 0.6);
            margin-bottom: 25px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .close-btn {
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: 900;
            font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
            color: #ffffff;
            background: #ff007f;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff007f;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: #ffffff;
            color: #000000;
            box-shadow: 0 0 30px #ffffff;
        }
    </style>
</head>
<body>

    <!-- 🚨 0. 최초 수신 화면 (Gatekeeper Overlay) -->
    <div class="gate-container" id="gateOverlay">
        <div class="gate-card">
            <div class="alert-icon">📩</div>
            <div class="gate-title">수상한 초대장이 도착했습니다!</div>
            <div class="gate-desc">열어보시겠습니까? 🔓</div>
            <button class="btn btn-open" onclick="unlockTicket()">초대장 열어보기 ⚡</button>
        </div>
    </div>

    <!-- 🎟️ 1. 메인 초대장 카운터 카드 -->
    <div class="ticket">
        <div class="vip-tag">EXCLUSIVE INVITATION</div>
        <div class="title">LUCKY DRAW</div>
        <div class="subtitle">🎉 조연우를 위한 럭키 드로우 🎉</div>

        <div class="divider"></div>

        <div class="content">
            지난 반년간 수고 많으셨습니다.<br>
            고생한 당신을 위해 준비된<br>
            시크릿 럭키 드로우 이벤트에 초대합니다.<br><br>
            아래 버튼을 눌러 액세스 코드를 확인하세요!
        </div>

        <!-- 🔑 비밀번호 확인 버튼 -->
        <button class="btn" onclick="openHint()">액세스 코드 확인하기 🙈</button>
    </div>

    <!-- 🔒 2. 비밀번호 힌트 모달 -->
    <div class="modal-overlay" id="hintModal">
        <div class="modal-card">
            <div class="modal-label">SECRET ACCESS CODE</div>
            <div class="modal-title">🔑 ACCESS CODE 🔑</div>
            
            <div class="hint-box">
                소중한 여자친구의 생일 4자리 🤭
            </div>

            <div class="sub-hint">💡잘 외워두세요!💡</div>

            <button class="close-btn" onclick="closeHint()">확인 완료</button>
        </div>
    </div>

    <script>
        // 초대장 열기 함수
        function unlockTicket() {
            document.getElementById('gateOverlay').classList.add('hidden');
        }

        // 비밀번호 힌트 팝업 열기/닫기
        function openHint() {
            document.getElementById('hintModal').classList.add('active');
        }

        function closeHint() {
            document.getElementById('hintModal').classList.remove('active');
        }
    </script>

</body>
</html>
